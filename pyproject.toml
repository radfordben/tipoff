[project]
name = "tipoff"
version = "0.1.0"
description = "Terminal TUI for tracking NBA playoffs"
authors = [{ name = "Ben Radford" }]
readme = "README.md"
keywords = ["python", "nba", "basketball", "tui", "playoffs"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "textual>=3.0.0",
    "httpx>=0.28.0",
    "nba_api>=1.5.0",
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
tipoff = "tipoff.cli:main"

[project.urls]
Repository = "https://github.com/benr/tipoff"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipoff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "SIM",
    "I",
    "C90",
    "E",
    "W",
    "F",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true